spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/apiTsea
spring.datasource.username=postgres
spring.datasource.password=0108

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do servidor
server.port=8080

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# Security
app.jwt.secret=${JWT_SECRET:chave-temporaria-troque-em-producao-min-256-bits-1234567890}
app.jwt.expiration-ms=86400000
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin1234}

# Não expor stack traces nas respostas
server.error.include-stacktrace=never
server.error.include-message=never

app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
app.mqtt.client-id=${MQTT_CLIENT_ID:zaiko-api}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.pulse-duration-ms=${MQTT_PULSE_MS:5000}
app.mqtt.station-topic-prefix=${MQTT_STATION_PREFIX:zaiko/station/}
app.mqtt.station-count=2
app.mqtt.tool-mapping=Eletrodo 6013 2.5mm=1,Disco de corte 4 1/2=2