spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/apiTsea
spring.datasource.username=postgres
spring.datasource.password=0108

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do servidor
server.port=8080

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# Security
app.jwt.secret=${JWT_SECRET:chave-temporaria-troque-em-producao-min-256-bits-1234567890}
app.jwt.expiration-ms=86400000
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin1234}

# Não expor stack traces nas respostas
server.error.include-stacktrace=never
server.error.include-message=never

app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
app.mqtt.client-id=${MQTT_CLIENT_ID:zaiko-api}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.pulse-duration-ms=${MQTT_PULSE_MS:5000}
app.mqtt.topic=${MQTT_TOPIC:zaiko/servos}
# Produto = numero do servo. Servo 1..6 = pinos 18, 19, 21, 22, 5, 23.
# Nome tem que bater exatamente com tools.name; acento escapado porque
# .properties nao e garantido como UTF-8.
app.mqtt.servo-count=6
app.mqtt.tool-servos=Eletrodo 6013 2.5mm=1,Fita isolante=2,Lixa 120=3,Disco de corte 4 1/2=4,M\u00e1scara descart\u00e1vel=5,Broca 10mm=6
