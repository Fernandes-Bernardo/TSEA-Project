spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/apiTsea
spring.datasource.username=postgres
spring.datasource.password=0108

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do servidor
server.port=8080

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# Security
app.jwt.secret=${JWT_SECRET:chave-temporaria-troque-em-producao-min-256-bits-1234567890}
app.jwt.expiration-ms=86400000
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin1234}

# Não expor stack traces nas respostas
server.error.include-stacktrace=never
server.error.include-message=never